name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write  # Required to create releases

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rembg pillow onnxruntime pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller remover.py `
            --name remover-portable-${{ github.ref_name }} `
            --onefile `
            --windowed `
            --distpath dist `
            --workpath build `
            --specpath build
        shell: pwsh

      - name: Prepare release folder
        run: |
          New-Item -ItemType Directory -Path release -Force
          Copy-Item dist\remover-portable-${{ github.ref_name }}.exe release\
        shell: pwsh

      - name: Create ZIP archive (optional)
        run: |
          Compress-Archive -Path release\* -DestinationPath remover-portable-Windows-${{ github.ref_name }}.zip
        shell: pwsh

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            release\remover-portable-${{ github.ref_name }}.exe
            remover-portable-Windows-${{ github.ref_name }}.zip
