name: Build EXE on Commit

on:
  push:
    branches:
    - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
    
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
    
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rembg pillow onnxruntime pyinstaller
    
      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name remover-portable remover.py
    
      - name: Upload EXE as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: remover-portable
          path: dist\remover-portable.exe
